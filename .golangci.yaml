version: "2"

linters:
  # Keep this list explicit. "default: all" makes upgrades silently add new,
  # potentially expensive or noisy linters.
  default: none
  enable:
    # Correctness and suspicious control flow.
    - asasalint
    - canonicalheader
    - durationcheck
    - errorlint
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - errcheck
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnesserr
    - reassign
    - staticcheck
    - unconvert
    - wastedassign

    # Resource lifecycle and protocol safety.
    - bodyclose
    - nosprintfhostport
    - rowserrcheck
    - sqlclosecheck

    # Cheap security and maintainability checks.
    - bidichk
    - errname
    - goprintffuncname
    - iotamixing
    - misspell
    - nolintlint
    - protogetter
    - recvcheck
    - zerologlint

    # Module policy.
    - gomoddirectives

  # staticcheck is enabled with its remaining intentional findings baselined
  # via targeted //nolint:staticcheck comments (legacy cfg.Github migration
  # shims and deliberate empty-critical-section test assertions). Gosec is
  # better maintained as a separately tuned security job because its default
  # rules are noisy for this CLI/server codebase.
  settings:
    errcheck:
      # Genuinely benign write/cleanup calls whose errors carry no actionable
      # signal for this codebase. Close-family cleanup is discarded explicitly
      # at each call site (or handled where the close finalizes data); nothing
      # is suppressed by message pattern here.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Scanln
        - os.Remove
        - os.RemoveAll
    gomoddirectives:
      replace-allow-list:
        - github.com/bwmarrin/discordgo
    govet:
      enable:
        - shadow
      disable:
        # Go 1.26 modernization suggestion with little correctness value.
        - inline
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters:
          - nolintlint
        path: 'pkg/tools/(i2c\.go|spi\.go)$'
      # errcheck: defer test-file backlog (deferred from the maintenance pass).
      - linters:
          - errcheck
        path: '.*_test\.go'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
