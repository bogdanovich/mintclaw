name: build

on:
  push:
    branches: [ "main" ]

jobs:
  integration:
    name: Integration Tests
    uses: ./.github/workflows/integration.yml

  build:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build core binaries
        run: make build-all
