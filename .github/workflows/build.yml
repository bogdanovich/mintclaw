name: build

on:
  push:
    branches: [ "main" ]

jobs:
  checks:
    name: Full CI
    uses: ./.github/workflows/pr.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build core binaries
        run: make build-all
