name: PR

on:
  pull_request: { }
  workflow_call: { }
  workflow_dispatch: { }
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes and documentation
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      pdfium: ${{ steps.select.outputs.pdfium }}
      credentials: ${{ steps.select.outputs.credentials }}
      documents: ${{ steps.select.outputs.documents }}
      companion: ${{ steps.select.outputs.companion }}
      docker: ${{ steps.select.outputs.docker }}
      integration: ${{ steps.select.outputs.integration }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test CI selection
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Test desktop-free computer evaluation fixtures
        run: python3 -m unittest discover -s scripts/internal/computer-evaluation -p 'test_*.py' -v

      - name: Lint documentation layout
        run: bash ./scripts/lint-docs.sh

      - name: Select affected checks
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/select_checks.py

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend advisories
        run: pnpm audit:check

      - name: Check frontend formatting
        run: pnpm format

      - name: Lint frontend
        run: pnpm lint

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Install GolangCI Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: Test changed-package lint module routing
        run: bash ./scripts/test-pre-push-lint.sh

      - name: Check Go formatting
        run: golangci-lint fmt --config=.golangci-format.yaml --diff

      - name: Run GolangCI Lint
        run: golangci-lint run --concurrency=4 --build-tags=goolm,stdjson

  vuln_check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Security Check
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm,stdjson
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Govulncheck
        run: govulncheck -C . -format text ./...

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Validate browser smoke runner
        run: make test-browser-smoke

      - name: Validate direct Playwright library driver
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix runtime/browser/playwright-library
          browser_executable=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$browser_executable"
          MINTCLAW_BROWSER_TEST_EXECUTABLE="$browser_executable" \
            node --test runtime/browser/playwright-library/*.test.cjs
          MINTCLAW_BROWSER_REAL_DRIVER=1 \
          MINTCLAW_BROWSER_REAL_DRIVER_MODE=playwright_library \
          MINTCLAW_BROWSER_PLAYWRIGHT_LIBRARY_SIDECAR="$PWD/runtime/browser/playwright-library/sidecar.cjs" \
          MINTCLAW_BROWSER_REAL_DRIVER_EXECUTABLE="$browser_executable" \
            go test -count=1 -tags goolm,stdjson \
              -run '(RealBrowser|PlaywrightLibraryWorkerCancellationAndProcessLoss)' ./pkg/browser

      - name: Compile default Go test graph
        shell: bash
        run: time go test -tags goolm,stdjson -run '^$' ./...

      - name: Compile unsupported AIX coding thread package
        env:
          CGO_ENABLED: 0
          GOARCH: ppc64
          GOOS: aix
        run: go build -tags goolm,stdjson ./pkg/coding/thread

      - name: Run Go tests with timing
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -json -tags goolm,stdjson ./... | tee /tmp/mintclaw-go-test.json

      - name: Publish Go test timings
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/mintclaw-go-test.json ]]; then
            go run ./scripts/testtimings < /tmp/mintclaw-go-test.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
  race:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run targeted race regressions
        run: >-
          go test -count=1 -race -tags goolm,stdjson
          -run
          '^(TestConcurrentBuildSystemPromptWithCache|TestTaskRegistryReadinessPrecedesPublication|TestTaskRegistryReadinessAllowsCacheReconstruction|TestFinish_ConcurrentCalls|TestDeliverSubTurnResult_RaceWithFinish|TestSteeringQueue_ConcurrentAccess|TestSteerActiveCodingTurnLinearizesWithTerminalSeal|TestCodingSuspensionCommitRejectsLaterSteering|TestRunTurn_DelegatedSuspensionReturnsInMemorySteering|TestInteractionCoordinatorShutdownSharesWorkspaceBudget|TestAgentLoopCloseContextBoundsInteractionObservers|TestCloseContextDrainsProtectedRecoveryBeforeClosingSink|TestClosedLoopRefusesLateInteractionRecoveryBeforeRegistryMutation|TestAgentLoopCloseContextWaitsForInboundWorkerDrain|TestAgentLoopCloseContextTimeoutLeavesRegistryOpenForRetry|TestParallelMessageProcessing_DifferentSessionsProcessedConcurrently|TestParallelMessageProcessing_SameSessionProcessedSequentially|TestNativeCodingRuntimePreservesSteeringForSuspendedContinuation|TestGatewayProcessStartupRollbackBoundsAgentWorkerDrain|TestCronService_ConcurrentAccess|TestConcurrent_AddAndRead|TestConcurrent_SummarizeRace)$'
          ./pkg/agent
          ./cmd/mintclaw/internal/coding
          ./pkg/gateway
          ./pkg/cron
          ./pkg/memory

      - name: Run external wait continuation race regressions
        run: >-
          go test -count=1 -race -tags goolm,stdjson
          -run '^TestExternalWait' ./pkg/agent ./pkg/tools

      - name: Run delegated browser attachment race regressions
        run: >-
          go test -count=1 -race -tags goolm,stdjson
          -run '^(TestDelegateRetainedScreenshot|TestProtectedSuppressedMedia|TestRetainedMedia|TestUnavailableRetainedMedia|TestGatewayOutboundRecovery|TestCloneDeliverableRetainsPrivateRecovery|TestRetainedAttachmentModelNote)'
          ./pkg/agent
          ./pkg/gateway
          ./pkg/taskresult
          ./pkg/tools/shared

      - name: Run critical runtime race suites
        run: >-
          go test -count=1 -race -tags goolm,stdjson
          ./pkg/bus
          ./pkg/events
          ./pkg/channels
          ./pkg/tasks
          ./pkg/interactions
          ./pkg/nodes/ws

      - name: Run credential authority and private setup race suites
        run: >-
          go test -count=1 -race -tags goolm,stdjson
          ./pkg/credentialbroker/...
          ./internal/credentials/...
          ./cmd/mintclaw/internal/credentials

      - name: Run private browser credential race regressions
        run: >-
          go test -count=1 -race -tags goolm,stdjson
          -run '^Test(Credential|PrivateCredential)' ./pkg/browser

  platform_compile:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Compile ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            targets: linux/amd64 linux/arm/7 linux/arm64
          - name: Desktop
            targets: darwin/amd64 darwin/arm64 windows/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compile full Go test graph for every target
        env:
          COMPILE_TARGETS: ${{ matrix.targets }}
        run: bash scripts/ci/compile-platforms.sh

  macos_portability:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: macOS Portability
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run platform-sensitive tests
        run: >-
          go test -count=1 -p=4 -tags goolm,stdjson
          ./pkg/fileutil
          ./pkg/tools/fs
          ./pkg/tools/shellguard
          ./pkg/tools
          ./cmd/mintclaw-node
          ./pkg/updater
          ./pkg/workspace
          ./internal/eval

      - name: Check native structured console without models
        run: >-
          go test -count=1 -tags goolm,stdjson
          -run '^(TestConsoleFormatSelection|TestGatewayJSONConsoleNativeStartupAndShutdownWithoutModels)$'
          ./pkg/logger ./pkg/gateway

      - name: Check credential state filesystem aliases
        run: >-
          go test -count=1 -tags goolm,stdjson
          -run '^TestCredentialStateContainment' ./pkg/config

      - name: Check native qualification GUI preflight and exit status
        shell: bash
        run: |
          qualification_self_test="$RUNNER_TEMP/mintclaw-qualification-self-test"
          /usr/bin/swiftc -D MINTCLAW_QUALIFICATION_SELF_TEST \
            scripts/internal/computer-native-qualification/launcher_macos.swift \
            -o "$qualification_self_test"
          "$qualification_self_test"

      - name: Check native fixture Unicode caret protocol without desktop access
        shell: bash
        run: |
          fixture_text_self_test="$RUNNER_TEMP/mintclaw-fixture-text-self-test"
          /usr/bin/swiftc -D MINTCLAW_FIXTURE_TEXT_SELF_TEST \
            scripts/internal/computer-native-qualification/fixture_macos.swift \
            -o "$fixture_text_self_test"
          "$fixture_text_self_test"

      - name: Check Mac native ownership without GUI permissions, sixty repetitions
        run: >-
          go test -race -count=60 -tags goolm,stdjson -timeout=2m
          -run '^TestDarwinInput' ./pkg/computer/desktop

      - name: Check independent native input and ownership proof verifiers
        run: >-
          go test -count=1 -tags goolm,stdjson,integration
          -run '^TestNative(Input|Ownership)ChildVerification' ./cmd/mintclaw-node

      - name: Run workspace identity recovery tests
        shell: bash
        run: |
          agent_tests='^('
          agent_tests+='TestAgentLoopCanonicalizesWorkspaceAtConstruction|'
          agent_tests+='TestWithIsolatedSkillBootstrapUsesOnlyWorkspaceSkillRoot|'
          agent_tests+='TestSeahorseContextManagerIsolatesAgentRuntimes|'
          agent_tests+='TestGatewayContextPrefixCorpusAcrossRestart|'
          agent_tests+='TestRunAgentLoop_MessageToolMediaDeliveryBlocksBeforeFinalResponse|'
          agent_tests+='TestRunAgentLoop_MessageToolMediaDefaultsToTerminalDelivery|'
          agent_tests+='TestNewAgentLoopRegistersRequestUserInputByDefault|'
          agent_tests+='TestDisabledRequestUserInputStillInitializesRecoveryRegistry|'
          agent_tests+='TestRecoveryDoesNotResendPromptAfterAmbiguousCrashWindow|'
          agent_tests+='TestRecoveredDocumentToolMatchesWorkspaceAlias|'
          agent_tests+='TestNewCodingAgentLoopReadOnlyAuthorityOmitsMutationTools)$'
          go test -count=1 -tags goolm,stdjson \
            -run "$agent_tests" \
            ./pkg/agent
          go test -count=1 -tags goolm,stdjson \
            -run '^Test(PrefixOracle.*|ScriptedProviderCaptures.*|NativeCodingContextPrefixCorpus)$' \
            ./pkg/testharness/llmscenario ./cmd/mintclaw/internal/coding
          go test -count=1 -tags goolm,stdjson \
            -run '^TestFormWriteCoordinator' \
            ./pkg/document

      - name: Run native coding and remote handoff lifecycle
        shell: bash
        run: |
          coding_binary="$RUNNER_TEMP/mintclaw-coding-worker"
          companion_binary="$RUNNER_TEMP/mintclaw-node"
          go build -tags goolm,stdjson -o "$coding_binary" ./cmd/mintclaw
          go build -o "$companion_binary" ./cmd/mintclaw-node
          MINTCLAW_NODE_TEST_BINARY="$companion_binary" \
          MINTCLAW_CODING_WORKER_TEST_BINARY="$coding_binary" \
          MINTCLAW_REQUIRE_CODING_WORKER_E2E=1 \
          go test -count=1 -tags goolm,stdjson,integration \
            -run '^(TestNativeMintClawWorker.*|TestRemoteCodingTaskTelegramToNativeCompanionVerticalSlice)$' \
            ./pkg/coding/workerprocess ./pkg/gateway

      - name: Qualify native coding terminal and process lifecycle
        shell: bash
        run: |
          go test -count=1 -tags goolm,stdjson \
            -run '^(TestTerminalLifecycleEmitsRestorationForExitSignalAndPanic|TestTerminalPTYMatrixCoversRemoteNarrowAndRecoveryPresentation|TestTerminalPTYInterruptsActiveWorkThenReturnsToUsableShell|TestTerminalLifecycleRunsInsideTmuxWhenAvailable)$' \
            ./pkg/coding/tui
          go test -count=1 -tags goolm,stdjson \
            -run '^(TestThreadLeaseIsExclusiveAndReportsOwner|TestThreadLeaseRecoversAfterOwnerProcessCrash)$' \
            ./pkg/coding/thread
          go test -count=1 -tags goolm,stdjson \
            -run '^(TestManagerAllocatesIdempotentIsolatedWorktreeFromDirtySource|TestManagerMapsNestedInvocationDirectoryIntoExecutionWorktree|TestOwnerLeaseExcludesAnotherProcess)$' \
            ./pkg/coding/worktree
          go test -count=1 -tags goolm,stdjson \
            -run '^(TestTerminateKillsUnixWorkerProcessGroup|TestDetachedUnixDescendantDoesNotBlockNormalCompletion|TestDetachedUnixDescendantDoesNotBlockTermination)$' \
            ./pkg/coding/workerprocess

      - name: Smoke native coding CLI from zsh
        shell: zsh {0}
        run: go run -tags goolm,stdjson ./cmd/mintclaw code --help >/dev/null

      - name: Run shared context and cache lifecycle contracts
        run: bash scripts/test-context-cache-contracts.sh --unit-only

  pdfium_wasm_qualification:
    needs: changes
    if: needs.changes.outputs.pdfium == 'true'
    name: PDFium WASM (${{ matrix.name }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-latest
          - name: macOS ARM64
            runner: macos-15
          - name: macOS AMD64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install PDFium qualification vulnerability scanner
        if: matrix.name == 'Linux AMD64'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan PDFium qualification dependencies
        if: matrix.name == 'Linux AMD64'
        working-directory: internal/qualification/pdfiumwasm
        run: govulncheck -format text ./...

      - name: Qualify PDFium WebAssembly candidate
        working-directory: internal/qualification/pdfiumwasm
        run: ./qualify.sh

      - name: Run production portable read contract
        run: >-
          go test -count=1
          -run '^(TestPDFiumReadBackendMatchesPortableContract|TestPDFiumReadBackendFailsClosedWithoutFactory|TestResolveBackendSetFreezesPlatformComposition)$'
          ./pkg/document

      - name: Run production portable form discovery contract
        run: >-
          go test -count=1
          -run '^(TestPDFCPUFormFieldsBackendMatchesManifest|TestPortableFieldsRefuseHybridBeforeFormBackend)$'
          ./pkg/document

      - name: Run production portable form write contract
        run: >-
          go test -count=1
          -run '^(TestPortablePDFCPUFormWriteBackendUsesPDFiumVisibleReadback|TestPortablePDFCPUFormWriteBackendFillsSupportedMatrix|TestPortablePDFCPUFormWriteBackendRefusesHybridForm|TestPDFiumFormVerificationRejectsStaleAndClippedCandidate|TestPDFiumFormVerificationRejectsStaleListSelection)$'
          ./pkg/document

      - name: Run portable durable form lifecycle contract
        run: >-
          go test -count=1
          -run '^(TestFormWriteServiceFillsAndVerifiesDurableExpectation|TestFormWriteCoordinatorPersistsAndReplaysOneVerifiedGeneration|TestFormWriteCoordinatorRecoversEveryPredeliveryState|TestFormCommitApprovalMaterializationAndRestart|TestFormDeliveryAdmissionAndSettlement)$'
          ./pkg/document

      - name: Run portable composite form ledger contract
        run: go test -count=1 -run '^TestFormComposite' ./pkg/document

      - name: Run portable protected conversational intake contract
        run: go test -count=1 -run '^TestFormIntake' ./pkg/document

      - name: Run portable real-process document contract
        run: >-
          go test -count=1
          -run '^TestPortableProcess'
          ./pkg/document

      - name: Race-check PDFium WebAssembly cancellation boundary
        if: matrix.name == 'Linux AMD64'
        working-directory: internal/qualification/pdfiumwasm
        run: >-
          go test -race -count=1
          -run
          '^(TestPinnedModuleProvenanceAndImports|TestCandidateHasNoHostFilesystemView|TestCandidateKillInterruptsActiveRender|TestQualificationLimitsMatchRoadmapEnvelope)$'
          .

  integration:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    uses: ./.github/workflows/integration.yml
    with:
      credentials: ${{ needs.changes.outputs.credentials == 'true' }}
      documents: ${{ needs.changes.outputs.documents == 'true' }}
      companion: ${{ needs.changes.outputs.companion == 'true' }}
      docker: ${{ needs.changes.outputs.docker == 'true' }}

  browser_windows:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Windows AMD64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run portable Windows filesystem tests
        run: go test -tags goolm,stdjson -count=1 ./pkg/fileutil

      - name: Run Windows coding thread and lock tests
        run: >-
          go test -tags goolm,stdjson -count=1
          -run '^(TestThreadLease|TestWindowsThread(Lease|Trash)|TestTrashThread|TestPurgeThreadTrash|TestCodingStateOwnershipInventoryContract|TestAttachment(Maintenance|Inflight|GarbageCollectionDoesNotRecoverLiveQuarantine))'
          ./pkg/coding/thread

      - name: Qualify Windows headless coding
        run: >-
          go test -tags goolm,stdjson -count=1
          -run '^(TestThreadsTrashPurge|TestCodeAndResumePersistOutsideProjectAcrossCommands|TestCodeUsesInteractiveShellOnlyForCapableTerminal|TestPlainResultDistinguishesProjectAndWorkingDirectory)'
          ./cmd/mintclaw/internal/coding

      - name: Qualify Windows isolated coding worktrees
        run: >-
          go test -tags goolm,stdjson -count=1
          -run '^(TestManagerAllocatesIdempotentIsolatedWorktreeFromDirtySource|TestManagerMapsNestedInvocationDirectoryIntoExecutionWorktree|TestOwnerLeaseExcludesAnotherProcess)$'
          ./pkg/coding/worktree

      - name: Qualify Windows worker Job Object lifecycle
        run: >-
          go test -tags goolm,stdjson -count=1
          -run '^(TestTerminateKillsWindowsWorkerDescendants|TestNormalCompletionDrainsWindowsWorkerDescendantsHoldingStderr)$'
          ./pkg/coding/workerprocess

      - name: Smoke native coding CLI from PowerShell
        run: |
          go run -tags goolm,stdjson ./cmd/mintclaw code --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run portable protected intake and gateway composition
        run: >-
          go test -tags goolm,stdjson -count=1
          -run '^(TestDocumentIntake|TestDocumentFormIntake|TestGatewayDocumentIntakeComposition|TestGatewayDisabledDocument)'
          ./pkg/tools ./pkg/agent

      - name: Run native protected form intake on Windows
        run: >-
          go test -tags goolm,stdjson -count=1
          -run '^TestFormIntake'
          ./pkg/document
