name: PR

on:
  pull_request: { }

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm format

      - name: Lint frontend
        run: pnpm lint

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint documentation layout
        run: bash ./scripts/lint-docs.sh

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Install GolangCI Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: Check Go formatting
        run: golangci-lint fmt --config=.golangci-format.yaml --diff

      - name: Run GolangCI Lint
        run: golangci-lint run --concurrency=4 --build-tags=goolm,stdjson

  vuln_check:
    name: Security Check
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm,stdjson
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Govulncheck
        run: govulncheck -C . -format text ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Validate browser smoke runner
        run: make test-browser-smoke

      - name: Validate direct Playwright library driver
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix runtime/browser/playwright-library
          browser_executable=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$browser_executable"
          MINTCLAW_BROWSER_REAL_DRIVER=1 \
          MINTCLAW_BROWSER_REAL_DRIVER_MODE=playwright_library \
          MINTCLAW_BROWSER_PLAYWRIGHT_LIBRARY_SIDECAR="$PWD/runtime/browser/playwright-library/sidecar.cjs" \
          MINTCLAW_BROWSER_REAL_DRIVER_EXECUTABLE="$browser_executable" \
            go test -count=1 -tags goolm,stdjson \
              -run '(RealBrowser|PlaywrightLibraryWorkerCancellationAndProcessLoss)' ./pkg/browser

      - name: Compile default Go test graph
        shell: bash
        run: time go test -tags goolm,stdjson -run '^$' ./...

      - name: Compile unsupported AIX coding thread package
        env:
          CGO_ENABLED: 0
          GOARCH: ppc64
          GOOS: aix
        run: go build -tags goolm,stdjson ./pkg/coding/thread

      - name: Run Go tests with timing
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -json -tags goolm,stdjson ./... | tee /tmp/mintclaw-go-test.json

      - name: Publish Go test timings
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/mintclaw-go-test.json ]]; then
            go run ./scripts/testtimings < /tmp/mintclaw-go-test.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
  race:
    name: Race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run targeted race regressions
        run: >-
          go test -count=1 -race -tags goolm,stdjson
          -run
          '^(TestConcurrentBuildSystemPromptWithCache|TestFinish_ConcurrentCalls|TestDeliverSubTurnResult_RaceWithFinish|TestSteeringQueue_ConcurrentAccess|TestSteerActiveCodingTurnLinearizesWithTerminalSeal|TestCodingSuspensionCommitRejectsLaterSteering|TestRunTurn_DelegatedSuspensionReturnsInMemorySteering|TestNativeCodingRuntimePreservesSteeringForSuspendedContinuation|TestCronService_ConcurrentAccess|TestConcurrent_AddAndRead|TestConcurrent_SummarizeRace)$'
          ./pkg/agent
          ./cmd/mintclaw/internal/coding
          ./pkg/cron
          ./pkg/memory

      - name: Run critical runtime race suites
        run: >-
          go test -count=1 -race -tags goolm,stdjson
          ./pkg/bus
          ./pkg/events
          ./pkg/channels
          ./pkg/tasks
          ./pkg/interactions
          ./pkg/nodes/ws

  platform_compile:
    name: Compile ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Darwin ARM64
            goos: darwin
            goarch: arm64
          - name: Windows AMD64
            goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compile full Go test graph
        run: go test -exec=true -run '^$' -tags goolm,stdjson ./...

  macos_portability:
    name: macOS Portability
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run platform-sensitive tests
        run: >-
          go test -count=1 -p=4 -tags goolm,stdjson
          ./pkg/fileutil
          ./pkg/tools/fs
          ./pkg/tools/shellguard
          ./pkg/tools
          ./cmd/mintclaw-node
          ./pkg/updater
          ./pkg/workspace

      - name: Run workspace identity recovery tests
        shell: bash
        run: |
          agent_tests='^('
          agent_tests+='TestAgentLoopCanonicalizesWorkspaceAtConstruction|'
          agent_tests+='TestWithIsolatedSkillBootstrapUsesOnlyWorkspaceSkillRoot|'
          agent_tests+='TestSeahorseContextManagerIsolatesAgentRuntimes|'
          agent_tests+='TestRunAgentLoop_MessageToolMediaDeliveryBlocksBeforeFinalResponse|'
          agent_tests+='TestRunAgentLoop_MessageToolMediaDefaultsToTerminalDelivery|'
          agent_tests+='TestNewAgentLoopRegistersRequestUserInputByDefault|'
          agent_tests+='TestDisabledRequestUserInputStillInitializesRecoveryRegistry|'
          agent_tests+='TestRecoveryDoesNotResendPromptAfterAmbiguousCrashWindow|'
          agent_tests+='TestRecoveredDocumentToolMatchesWorkspaceAlias|'
          agent_tests+='TestNewCodingAgentLoopReadOnlyAuthorityOmitsMutationTools)$'
          go test -count=1 -tags goolm,stdjson \
            -run "$agent_tests" \
            ./pkg/agent
          go test -count=1 -tags goolm,stdjson \
            -run '^TestFormWriteCoordinator' \
            ./pkg/document

      - name: Run native coding and remote handoff lifecycle
        shell: bash
        run: |
          coding_binary="$RUNNER_TEMP/mintclaw-coding-worker"
          companion_binary="$RUNNER_TEMP/mintclaw-node"
          go build -tags goolm,stdjson -o "$coding_binary" ./cmd/mintclaw
          go build -o "$companion_binary" ./cmd/mintclaw-node
          MINTCLAW_NODE_TEST_BINARY="$companion_binary" \
          MINTCLAW_CODING_WORKER_TEST_BINARY="$coding_binary" \
          MINTCLAW_REQUIRE_CODING_WORKER_E2E=1 \
          go test -count=1 -tags goolm,stdjson,integration \
            -run '^(TestNativeMintClawWorker.*|TestRemoteCodingTaskTelegramToNativeCompanionVerticalSlice)$' \
            ./pkg/coding/workerprocess ./pkg/gateway

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install pinned document runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Run real companion vertical tests
        run: bash ./scripts/run-go-integration-tests.sh

      - name: Run Docker-backed integration suites
        run: bash ./scripts/run-integration-tests.sh

  browser_windows:
    name: Browser Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Windows platform tests
        run: |
          go test -tags goolm,stdjson ./pkg/browser ./pkg/fileutil
          go test -tags goolm,stdjson -run '^TestWriteJournal' ./pkg/document
          go test -tags goolm,stdjson ./pkg/coding/workerprocess
          go test -tags goolm,stdjson -run '^(TestThreadLease|TestWindowsThreadLease|TestAttachment(Maintenance|Inflight|GarbageCollectionDoesNotRecoverLiveQuarantine))' ./pkg/coding/thread
